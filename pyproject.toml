[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-bench"
version = "0.1.2"
description = "Post-Quantum Cryptography Benchmarking Suite"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Volodymyr Dubetskyy"},
    {name = "María-Dolores Cano"}
]
keywords = ["post-quantum", "cryptography", "benchmarking", "openssl", "pqc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
web = [
    "playwright>=1.40.0",
]

[project.scripts]
pqc-bench = "pqc_bench.cli:main"

[project.urls]
Homepage = "https://github.com/example/pqc-benchmarks"
Documentation = "https://github.com/example/pqc-benchmarks#readme"
Repository = "https://github.com/example/pqc-benchmarks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (parsers, stats, registry) - no external dependencies",
    "integration: Integration tests - may require mocked subprocess or actual OpenSSL",
    "slow: Slow tests that run actual benchmarks",
]
